
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Create your Fiama Flower Shop account">
  <title>Register | Fiama Flower Shop</title>
</head>

<body class="bg-white">

  <div id="header"></div>

  <main class="w-full bg-white">

    <!-- PAGE TITLE -->
    <section class="flex min-h-[77px] flex-col items-center justify-center bg-[#f1f1f1] py-3">

      <h1 class="text-xl font-bold text-black">
        Account
      </h1>

      <nav
        aria-label="Breadcrumb"
        class="mt-1 flex items-center gap-3 text-[10px] text-black"
      >
        <a href="/index.html" class="transition hover:text-[#ed5275]">
          Home
        </a>

        <span>›</span>

        <span>Register</span>
      </nav>

    </section>

    <!-- REGISTER CONTENT -->
    <section class="mx-auto max-w-[1200px] px-5 pb-16 pt-12 sm:px-8">

      <!-- REGISTER HEADING -->
      <div class="text-center">

        <h2 class="text-[22px] font-medium leading-[1.15] text-black">
          Register
          <span class="block">
            Your Account
          </span>
        </h2>

        <p class="mx-auto mt-3 max-w-[430px] text-[10px] leading-[17px] text-[#555]">
          Lorem ipsum dolor, sit amet consectetur adipisicing elit.
          <br>
          Sit aliquid, Non distinctio vel iste.
        </p>

      </div>

      <!-- REGISTER FORM -->
      <div class="mx-auto mt-8 max-w-[540px]">

        <form id="register-form" class="w-full">

          <!-- FIRST NAME -->
          <div>
            <label for="register-first-name" class="sr-only">
              First Name
            </label>

            <input
              id="register-first-name"
              name="firstName"
              type="text"
              placeholder="First Name"
              autocomplete="given-name"
              required
              class="h-[26px] w-full bg-[#f5f5f5] px-3 text-[10px] text-[#333] outline-none placeholder:text-[#888] focus:ring-1 focus:ring-[#ed5275]"
            >
          </div>

          <!-- LAST NAME -->
          <div class="mt-4">
            <label for="register-last-name" class="sr-only">
              Last Name
            </label>

            <input
              id="register-last-name"
              name="lastName"
              type="text"
              placeholder="Last Name"
              autocomplete="family-name"
              required
              class="h-[26px] w-full bg-[#f5f5f5] px-3 text-[10px] text-[#333] outline-none placeholder:text-[#888] focus:ring-1 focus:ring-[#ed5275]"
            >
          </div>

          <!-- EMAIL -->
          <div class="mt-4">
            <label for="register-email" class="sr-only">
              Email Address
            </label>

            <input
              id="register-email"
              name="email"
              type="email"
              placeholder="Email*"
              autocomplete="email"
              required
              class="h-[26px] w-full bg-[#f5f5f5] px-3 text-[10px] text-[#333] outline-none placeholder:text-[#888] focus:ring-1 focus:ring-[#ed5275]"
            >
          </div>

          <!-- PASSWORD -->
          <div class="mt-4">
            <label for="register-password" class="sr-only">
              Password
            </label>

            <input
              id="register-password"
              name="password"
              type="password"
              placeholder="Password*"
              autocomplete="new-password"
              minlength="8"
              required
              class="h-[26px] w-full bg-[#f5f5f5] px-3 text-[10px] text-[#333] outline-none placeholder:text-[#888] focus:ring-1 focus:ring-[#ed5275]"
            >
          </div>

          <!-- CONFIRM PASSWORD -->
          <div class="mt-4">
            <label for="register-confirm-password" class="sr-only">
              Confirm Password
            </label>

            <input
              id="register-confirm-password"
              name="confirmPassword"
              type="password"
              placeholder="Confirm Password*"
              autocomplete="new-password"
              minlength="8"
              required
              class="h-[26px] w-full bg-[#f5f5f5] px-3 text-[10px] text-[#333] outline-none placeholder:text-[#888] focus:ring-1 focus:ring-[#ed5275]"
            >
          </div>

          <!-- CONSENT CHECKBOXES -->
          <div class="mt-4 space-y-1">

            <label class="flex items-start gap-1.5 text-[9px] leading-[15px] text-[#777]">
              <input
                id="register-marketing-consent"
                name="marketingConsent"
                type="checkbox"
                class="mt-[2px] h-[10px] w-[10px] shrink-0 accent-[#ed5275]"
              >

              <span>
                I consent to Herbol processing my personal data in order to send personalized
                marketing material in accordance with the consent form and the privacy policy.
              </span>
            </label>

            <label class="flex items-start gap-1.5 text-[9px] leading-[15px] text-[#777]">
              <input
                id="register-privacy-consent"
                name="privacyConsent"
                type="checkbox"
                required
                class="mt-[2px] h-[10px] w-[10px] shrink-0 accent-[#ed5275]"
              >

              <span>
                By clicking "create account", I consent to the privacy policy.
              </span>
            </label>

          </div>

          <!-- REGISTER BUTTON -->
          <button
            type="submit"
            class="mt-4 flex h-[28px] min-w-[120px] items-center justify-center bg-[#ed5275] px-5 text-[9px] font-semibold text-white transition hover:bg-[#333]"
          >
            CREATE ACCOUNT
          </button>

          <!-- REGISTER MESSAGE -->
          <p
            id="register-message"
            class="mt-3 text-[10px]"
            aria-live="polite"
          ></p>

        </form>

        <!-- TERMS AND PRIVACY -->
        <div class="mt-1 text-center">

          <p class="text-[9px] text-[#555]">
            By creating an account, you agree to our.
          </p>

          <div class="mt-4 flex items-center justify-center gap-3 text-[9px] text-black">

            <a
              href="#"
              class="transition hover:text-[#ed5275]"
            >
              TERMS OF CONDITIONS
            </a>

            <span>|</span>

            <a
              href="#"
              class="transition hover:text-[#ed5275]"
            >
              PRIVACY POLICY
            </a>

          </div>

        </div>

        <!-- LOGIN LINK -->
        <div class="mt-7 text-center">

          <a
            href="/account.html"
            class="text-[9px] text-[#777] transition hover:text-[#ed5275]"
          >
            ALREADY HAVE AN ACCOUNT ?
          </a>

        </div>

      </div>

    </section>

  </main>

  <div id="footer"></div>

  <script type="module" src="/src/main.js"></script>
  <script type="module" src="/src/js/main.js"></script>

</body>
</html>
