
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Your Wishlist | Fiama Flower Shop">
  <title>Wishlist | Fiama Flower Shop</title>
</head>

<body class="bg-white">

  <div id="header"></div>

  <main>

    <!-- PAGE TITLE -->
    <section class="bg-[#f0f0f0] py-7 text-center">
      <h1 class="text-2xl font-bold text-black">Wishlist</h1>

      <div class="mt-1 flex items-center justify-center gap-2 text-xs text-black">
        <a href="/index.html" class="hover:text-pink-600">Home</a>
        <span>›</span>
        <span>Wishlist</span>
      </div>
    </section>

    <!-- WISHLIST PRODUCTS -->
    <section class="mx-auto w-full max-w-[1036px] px-4 pb-12 pt-10 sm:px-6 sm:pb-16 sm:pt-14 lg:px-0">

      <div id="wishlist-items" class="min-w-0"></div>

      <!-- EMPTY WISHLIST -->
      <div id="wishlist-empty" class="hidden py-12 text-center sm:py-16">

        <h2 class="text-lg font-semibold text-gray-800 sm:text-xl">
          Your Wishlist is Empty
        </h2>

        <p class="mx-auto mt-2 max-w-md text-sm leading-6 text-gray-500">
          You haven't added any products to your wishlist yet.
        </p>

        <a
          href="/shop-left-sidebar.html"
          class="mt-6 inline-block bg-[#555] px-6 py-3 text-sm text-white transition hover:bg-pink-600 sm:px-8"
        >
          Continue Shopping
        </a>

      </div>

    </section>

  </main>

  <div id="footer"></div>

  <script type="module" src="/src/main.js"></script>
  <script type="module" src="/src/js/main.js"></script>

</body>
</html>
